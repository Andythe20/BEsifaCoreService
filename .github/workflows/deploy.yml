name: Build and Deploy Core Service

on:
  push:
    branches:
      - prod

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Export secrets from Doppler
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          doppler secrets download \
            --no-file \
            --format json | jq -r '
              to_entries[]
              | "\(.key)<<EOF\n\(.value)\nEOF"
            ' >> $GITHUB_ENV

      # Falla rápido si faltan secretos en Doppler: sin ellos Spring no puede
      # resolver los placeholders y el contenedor moriría en el arranque.
      - name: Verify required secrets
        run: |
          missing=0
          for v in INTERNAL_JWT_SECRET INTERNAL_JWT_ISSUER INTERNAL_JWT_AUDIENCE \
                   INTERNAL_CHANNEL_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::Falta el secreto '$v' en Doppler"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}


      - name: Build Docker image
        run: |
          docker build -t jarodsm/sifa-core:latest .

      - name: Push Docker image
        run: |
          docker push jarodsm/sifa-core:latest

      - name: Generate runtime env
        run: |
          cat > core.env <<EOF
          DB_HOST=${DB_HOST}
          DB_PORT=${DB_PORT}
          DB_NAME_CORE=${DB_NAME_CORE}
          DB_USER=${DB_USER}
          DB_PASSWORD=${DB_PASSWORD}

          SERVER_PORT=8083
          SPRING_PROFILES_ACTIVE=prod
          BCRYPT_STRENGTH=10

          # Token interno X-Auth-Identity (validado por InternalJwtUtil)
          INTERNAL_JWT_SECRET=${INTERNAL_JWT_SECRET}
          INTERNAL_JWT_ISSUER=${INTERNAL_JWT_ISSUER}
          INTERNAL_JWT_AUDIENCE=${INTERNAL_JWT_AUDIENCE}
          # Firma del canal interno exigida por ChannelKeyFilter
          INTERNAL_CHANNEL_KEY=${INTERNAL_CHANNEL_KEY}

          AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME}
          AWS_S3_REGION=${AWS_S3_REGION}
          
          FIREBASE_CREDENTIALS=${FIREBASE_CREDENTIALS}
          EOF

      - name: Create SSH key
        run: |
          echo "${EC2_SSH_KEY}" > key.pem
          chmod 600 key.pem

      - name: Copy env to core server
        run: |
          scp \
            -i key.pem \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ProxyCommand="ssh -i key.pem -W %h:%p -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ubuntu@${EC2_HOST}" \
            core.env \
            ubuntu@${CORE_PRIVATE_HOST}:/tmp/core.env

      - name: Deploy Core Service
        run: |
          ssh \
            -i key.pem \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ProxyCommand="ssh -i key.pem -W %h:%p -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ubuntu@${EC2_HOST}" \
            ubuntu@${CORE_PRIVATE_HOST} << 'EOF'

              set -e

              trap "rm -f /tmp/core.env" EXIT

              echo "Pulling latest image..."
              docker pull jarodsm/sifa-core:latest

              echo "Stopping old container..."
              docker rm -f sifa-core || true

              echo "Starting new container..."

              docker run -d \
                --name sifa-core \
                --restart unless-stopped \
                -p 10.0.2.30:80:8083 \
                --env-file /tmp/core.env \
                jarodsm/sifa-core:latest

              echo "Verifying deployment..."
              code=000
              for i in $(seq 1 12); do
                sleep 10
                code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 \
                  http://10.0.2.30/ 2>/dev/null || true)
                if [ -n "$code" ] && [ "$code" != "000" ]; then
                  break
                fi
              done

              if [ -z "$code" ] || [ "$code" = "000" ]; then
                echo "::error::El servicio core no responde en 10.0.2.30:80"
                docker logs --tail 100 sifa-core 2>&1 || true
                exit 1
              fi

              echo "Core responde con HTTP $code"

          EOF

      - name: Cleanup
        run: |
          rm -f key.pem
          rm -f core.env